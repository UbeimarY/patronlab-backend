app = "patronlab-api-ubeimar"
# Same metro area as the Neon database (AWS us-east-1): lowest latency.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
    CORS_ORIGINS = '["http://localhost:4200","https://patronlab-ubeimar.netlify.app"]'

[http_service]
  internal_port = 8000
  force_https = true
  # Always on until the end of the course: no cold starts during the review.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# Measured: ~190 MB after start, ~350 MB at the peak of one AI job. AI jobs run one
# at a time (AI_CONCURRENCY=1) to stay under 512 MB; running two at once needs 1 GB.
[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
